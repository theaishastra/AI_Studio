<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Studio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Cache-busting query string ("v=N") on every admin asset below - bump it
     whenever admin/css or admin/js changes, so staff browsers fetch the new
     file instead of quietly reusing yesterday's cached copy (StaticFiles sets
     Last-Modified/ETag, but browsers can still serve a heuristically "fresh"
     cached response without revalidating). -->
<link rel="stylesheet" href="css/admin.css?v=10">
</head>
<body>
  <div class="mobile-topbar">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu">☰</button>
    <h2>Sai Kumar Studio</h2>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <h2>Sai Kumar Studio</h2>
      <nav>
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/categories" data-route="categories">Categories</a>
        <a href="#/products" data-route="products">Products & Packages</a>
        <a href="#/arrange" data-route="arrange">Arrange</a>
        <a href="#/coupons" data-route="coupons">Coupons & Offers</a>
        <a href="#/bookings" data-route="bookings">Bookings</a>
        <a href="#/orders" data-route="orders">Orders</a>
        <a href="#/customers" data-route="customers">Customers</a>
        <a href="#/reviews" data-route="reviews">Reviews</a>
        <a href="#/media" data-route="media">Media Library</a>
        <a href="#/homepage" data-route="homepage">Homepage Builder</a>
        <a href="#/settings" data-route="settings">Settings</a>
        <a href="#/staff" data-route="staff" class="owner-only">Staff</a>
        <a href="#/audit" data-route="audit" class="owner-only">Audit Log</a>
        <a href="#/activity" data-route="activity" class="owner-only">Activity</a>
        <a href="#" id="logoutLink" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">Log out (<span id="userEmail"></span>)</a>
      </nav>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <script src="js/api.js?v=10"></script>
  <script src="js/core.js?v=10"></script>
  <script src="js/catalog.js?v=10"></script>
  <script src="js/coupons.js?v=10"></script>
  <script src="js/bookings.js?v=10"></script>
  <script src="js/staff.js?v=10"></script>
  <script src="js/orders.js?v=10"></script>
  <script src="js/customers.js?v=10"></script>
  <script src="js/reviews.js?v=10"></script>
  <script src="js/media.js?v=10"></script>
  <script src="js/settings.js?v=10"></script>
  <script src="js/homepage.js?v=10"></script>
  <script src="js/arrange.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
